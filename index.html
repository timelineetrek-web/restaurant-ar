<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Restaurant AR Menu</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="hud">
    <h1>Restaurant AR Menu</h1>
    <p>Tap Start AR, find a table surface, then tap the blue ring to place the food. After placement, drag to rotate and pinch to resize.</p>
  </div>
  <div id="status">Checking AR support…</div>
  <div id="controls-hint" hidden>☝️ Drag = rotate &nbsp; • &nbsp; 🤏 Pinch = resize</div>
  <button id="remove-food" hidden>Remove food</button>
  <script type="module" src="./app.js"></script>
</body>
</html>
